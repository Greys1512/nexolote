services:
  - type: web
    name: nexolote-backend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start:render
    envVars:
      - key: DB_HOST
        value: gateway01.ap-northeast-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        value: 3dgXm2rFafaZrdh.root
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        value: nexolote
      - key: DB_CA
        value: ./certs/tidb-ca.pem
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRA
        value: 8h
      - key: FRONTEND_ORIGIN
        sync: false
    disk:
      name: certs-disk
      mountPath: /opt/render/project/src/certs
      sizeGB: 1
