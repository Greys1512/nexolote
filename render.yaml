services:
  - type: web
    name: nexolote-api
    runtime: node
    plan: free
    region: singapore
    rootDir: BACKEND
    buildCommand: npm ci && npm run build
    startCommand: npm run start:render
    healthCheckPath: /
    envVars:
      - key: GATEWAY_HOST
        value: 0.0.0.0
      - key: SERVICE_HOST
        value: 127.0.0.1
      - key: JWT_EXPIRA
        value: 8h
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 4000
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_CA_CERT
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
